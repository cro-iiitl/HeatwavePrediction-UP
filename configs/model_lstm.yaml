# configs/model_lstm.yaml
# Tier 3 LSTM — final locked configuration, validated via walk-forward evaluation.
# See docs/model_comparison_report.md for the full story: the original
# fixed-split-tuned config appeared to beat GBM, but failed to generalize
# across walk-forward folds -- this config is the corrected result.

window_length_days: 15

hyperparameters:
  hidden_units: 32
  learning_rate: 0.0001
  dropout: 0.3
  dense_units: 32
  batch_size: 128
  max_epochs: 30
  early_stopping_patience: 15

validation:
  fixed_split_search:
    method: "2-stage grid search (hidden_units/learning_rate, then dropout/dense_units), single split (1984-2010 train / 2011-2018 val)"
    winner: { hidden_units: 32, learning_rate: 0.0003, dropout: 0.2, dense_units: 32, rmse_7_10: 2.2954 }
    note: >
      SUPERSEDED. This config appeared to beat GBM on the single split
      (2.2954 vs 2.3388) but failed to generalize -- GBM beat it in every
      walk-forward fold, often by a wide margin. Classic overfitting-to-
      one-validation-window. Retained here as a documented cautionary
      finding, not as the current recommended config.

  walk_forward_search:
    method: "5 configurations targeting the capacity/regularization
      hypothesis, evaluated across all 3 walk-forward folds, selection
      metric = average RMSE(7-10) across folds"
    grid_tested:
      - { hidden_units: 32, dropout: 0.3, learning_rate: 0.0001, dense_units: 32, avg_rmse_7_10: 2.6507 }  # chosen
      - { hidden_units: 32, dropout: 0.2, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 2.7062 }  # fixed-split winner, re-evaluated
      - { hidden_units: 16, dropout: 0.2, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 2.7921 }
      - { hidden_units: 32, dropout: 0.4, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 3.2659 }
      - { hidden_units: 16, dropout: 0.4, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 3.3925 }
    finding: >
      Lower learning rate (0.0001) + moderate dropout (0.3) generalizes
      meaningfully better than the original config (2.6507 vs 2.7062).
      However, simply reducing capacity (hidden_units=16) or increasing
      dropout further (0.4) made generalization WORSE, not better --
      the original "reduce capacity to fix overfitting" hypothesis was
      only partially correct. Even the best LSTM config here does not
      close the gap to GBM.
    full_results_csv: "scripts/kaggle_output/lstm_walkforward_tuning.csv"

performance:
  walk_forward_avg_rmse_7_10: 2.6507
  fold_breakdown: { fold_1: 2.7303, fold_2: 2.4640, fold_3: 2.7580 }

comparison_to_other_tiers:
  gbm_tier2_walk_forward_tuned: { avg_rmse_7_10: 2.3976 }
  note: >
    LSTM, even after correct walk-forward-aware retuning, is beaten by
    GBM by a substantial, consistent margin (0.253 RMSE). Full comparison
    and methodology in docs/model_comparison_report.md.

known_limitations:
  - "Search was narrow (5 configs), targeted at one hypothesis (capacity/regularization) -- a broader architectural search was not attempted."
  - "No random seed was fixed in the original walk-forward runs that first revealed the fixed-split overfitting problem -- exact numbers for the superseded config varied slightly run to run, though the qualitative conclusion (GBM wins every fold) was consistent."