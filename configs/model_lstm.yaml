# configs/model_lstm.yaml
# Tier 3 LSTM — final locked configuration, validated via walk-forward evaluation.
# See docs/model_comparison_report.md for the full story: the original
# fixed-split-tuned config appeared to beat GBM, but failed to generalize
# across walk-forward folds -- this config is the corrected result.

window_length_days: 15

hyperparameters:
  hidden_units: 32
  learning_rate: 0.0001
  dropout: 0.3
  dense_units: 32
  batch_size: 128
  max_epochs: 30
  early_stopping_patience: 15

validation:
  fixed_split_search:
    method: "2-stage grid search (hidden_units/learning_rate, then dropout/dense_units), single split (1984-2010 train / 2011-2018 val)"
    winner: { hidden_units: 32, learning_rate: 0.0003, dropout: 0.2, dense_units: 32, rmse_7_10: 2.2954 }
    note: >
      SUPERSEDED. This config appeared to beat GBM on the single split
      (2.2954 vs 2.3388) but failed to generalize -- GBM beat it in every
      walk-forward fold, often by a wide margin. Classic overfitting-to-
      one-validation-window. Retained here as a documented cautionary
      finding, not as the current recommended config.

  walk_forward_search:
    method: "5 configurations targeting the capacity/regularization
      hypothesis, evaluated across all 3 walk-forward folds, selection
      metric = average RMSE(7-10) across folds"
    grid_tested:
      - { hidden_units: 32, dropout: 0.3, learning_rate: 0.0001, dense_units: 32, avg_rmse_7_10: 2.6507 }  # chosen
      - { hidden_units: 32, dropout: 0.2, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 2.7062 }  # fixed-split winner, re-evaluated
      - { hidden_units: 16, dropout: 0.2, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 2.7921 }
      - { hidden_units: 32, dropout: 0.4, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 3.2659 }
      - { hidden_units: 16, dropout: 0.4, learning_rate: 0.0003, dense_units: 32, avg_rmse_7_10: 3.3925 }
    finding: >
      Lower learning rate (0.0001) + moderate dropout (0.3) generalizes
      meaningfully better than the original config (2.6507 vs 2.7062).
      However, simply reducing capacity (hidden_units=16) or increasing
      dropout further (0.4) made generalization WORSE, not better --
      the original "reduce capacity to fix overfitting" hypothesis was
      only partially correct. Even the best LSTM config here does not
      close the gap to GBM.
    full_results_csv: "scripts/kaggle_output/lstm_walkforward_tuning.csv"

  location_feature_test:
    method: "Added lat/lon as per-timestep repeated features (static values repeated across all 15 input days), compared with/without across all 3 walk-forward folds"
    result:
      without_lat_lon: 2.5451
      with_lat_lon: 2.7399
      regression: -0.1948
    note: >
      Substantial, consistent REGRESSION across all 3 folds (2.5320->2.7704,
      2.5659->2.6776, 2.5373->2.7716) -- opposite effect from GBM, where
      the same feature addition helped. Likely cause: lat/lon repeated
      identically at every one of 15 timesteps dilutes the gradient
      signal the LSTM must learn to extract genuinely time-varying
      features around, unlike GBM's independent per-sample tree splits
      which can cleanly exploit static features without this cost.
      NOT added to SEQUENCE_FEATURE_COLUMNS -- reverted. Demonstrates
      the same feature-engineering choice does not transfer uniformly
      across architectures.
    full_results_csv: "scripts/kaggle_output/lstm_lat_lon_feature_test.csv"

performance:
  walk_forward_avg_rmse_7_10_observed_range: "2.5451 - 2.7211"
  observed_runs:
    - { source: "first walk-forward run (original flawed config, informal)", avg_rmse_7_10: 2.7211 }
    - { source: "Kaggle walk-forward tuning search", avg_rmse_7_10: 2.6507 }
    - { source: "local confirmation run", avg_rmse_7_10: 2.6385 }
    - { source: "lat/lon test, without-lat/lon baseline", avg_rmse_7_10: 2.5451 }
  note: >
    Same locked config (hidden_units=32, dropout=0.3, lr=0.0001)
    produced these four different walk-forward averages across separate
    runs, a 0.176 RMSE spread, because no random seed was fixed in any
    of these runs. Unlike GBM, LSTM's seed-to-seed stability for this
    final config was never separately quantified with a dedicated
    seed-variance check (see known_limitations) -- a deliberate,
    accepted gap, not an oversight, since the conclusion below does not
    depend on resolving it.

comparison_to_other_tiers:
  gbm_tier2_walk_forward: { avg_rmse_7_10: 2.3904, feature_set: "19 features, includes lat/lon" }
  note: >
    GBM beats LSTM regardless of which observed LSTM run is used for
    comparison -- GBM's result (2.3904) is below even LSTM's best
    observed case (2.5451) by 0.1547, and below LSTM's worst observed
    case (2.7211) by 0.3307. The "GBM wins" conclusion does not depend
    on resolving LSTM's own run-to-run variance.

known_limitations:
  - "Search was narrow (5 configs), targeted at one hypothesis (capacity/regularization) -- a broader architectural search was not attempted."
  - "No random seed was fixed across ANY LSTM walk-forward run for this project, producing a 0.176 RMSE spread on the identical locked config across 4 separate runs. A dedicated 3-seed variance check (the same treatment applied to GBM) was deliberately not run, since GBM's best case still clearly beats LSTM's best observed case -- accepted as an open gap given it does not change the tier ranking, not resolved."
  - "lat/lon feature test used the without-lat/lon baseline (2.5451) as the reference LSTM number in comparisons -- this happens to be the lowest (best) of the four observed runs, not a value chosen because it was lowest; documented here so this isn't read as selective reporting."