# configs/model_lstm.yaml
# Tier 3 LSTM — final locked configuration.
# window_length_days must stay identical across all model tiers (master §8.6).
# Other hyperparameters below are Tier 3-specific; Tier 4 requires its own tuning.

window_length_days: 15

hyperparameters:
  hidden_units: 32
  learning_rate: 0.0003
  dropout: 0.2
  dense_units: 32
  batch_size: 128
  max_epochs: 30
  early_stopping_patience: 15

validation:
  fixed_split:
    train: ["1984-01-01", "2010-12-31"]
    validation: ["2011-01-01", "2018-12-31"]

  window_length_selection:
    candidates_tested: [10, 15, 20, 30]
    metric: "validation RMSE, horizon days 7-10"
    result:
      window_10: 2.3099   # full-scale, seed-averaged, final hyperparameters
      window_15: 2.3052   # full-scale, seed-averaged, final hyperparameters
      window_20: 2.3934   # placeholder-hyperparameter ablation only
      window_30: 2.4834   # placeholder-hyperparameter ablation only
    note: >
      window=10 and window=15 are statistically indistinguishable
      (seed range 0.0130 exceeds their 0.0047 mean gap); window=15
      retained for lower run-to-run variance (std 0.0031 vs 0.0075).
      window=20/30 are unambiguously worse and were not re-tested at
      full scale.

  acf_pacf_diagnostic:
    districts_sampled: ["banda", "kushinagar"]
    pacf_cutoff_lag: { banda: 18, kushinagar: 27 }
    note: >
      Diagnostic favored longer windows (18-27) than the empirical
      result (10-15, tied). Explained by PACF being a linear measure of
      autocorrelation strength, which does not predict whether an LSTM
      can exploit that lag well enough to outweigh added overfitting
      risk at this data volume.

  hyperparameter_tuning:
    method: "2-stage grid search, full 75-district pool, GPU (Kaggle T4), W&B-logged"

    stage_1:
      swept: ["hidden_units", "learning_rate"]
      grid:
        hidden_units: [32, 64, 128]
        learning_rate: [0.0001, 0.0003, 0.001, 0.003]
      held_fixed: { dropout: 0.2, dense_units: 32, batch_size: 128,
                    max_epochs: 30, early_stopping_patience: 15 }
      winner: { hidden_units: 32, learning_rate: 0.0003, rmse_7_10: 2.3040 }
      finding: >
        Learning rate dominates: RMSE increases monotonically with
        learning rate within every hidden_units group (higher rates
        overfit faster within the fixed 30-epoch budget). hidden_units
        effect is weaker: 32 and 64 nearly tied at low learning rates,
        128 consistently worse -- model has more capacity than this
        problem needs; extra parameters add overfitting surface, not
        useful signal.

    stage_2:
      swept: ["dropout", "dense_units"]
      grid:
        dropout: [0.1, 0.2, 0.3, 0.4]
        dense_units: [16, 32, 64]
      held_fixed: { hidden_units: 32, learning_rate: 0.0003, batch_size: 128,
                    max_epochs: 30, early_stopping_patience: 15 }
      top_result: { dropout: 0.1, dense_units: 64, rmse_7_10: 2.2977 }
      chosen: { dropout: 0.2, dense_units: 32, rmse_7_10: 2.2991 }
      finding: >
        Landscape flat across dropout 0.1-0.3 and dense_units 16-64
        (top 2 configs differ by 0.0014, within noise). Only dropout=0.4
        is consistently worse, plausibly over-regularizing an
        already-small model. Chose dropout=0.2/dense_units=32 over the
        literal top row: statistically indistinguishable, matches the
        original placeholder default, avoids unnecessary config churn
        for no measurable gain -- a judgment call on a flat landscape,
        not a numerically forced choice.

    full_results:
      - "scripts/kaggle_output/tuning_stage1_results.csv"
      - "scripts/kaggle_output/tuning_stage2_results.csv"
      - "scripts/kaggle_output/seed_variance_full_scale_results.csv"

performance:
  rmse_avg_7_10: 2.2954
  rmse_avg_1_10: 2.1177
  skill_score_vs_climatological_normal: 0.2759
  skill_score_formula: "1 - (RMSE_model^2 / RMSE_climatology^2)"
  baseline_rmse_7_10:
    climatological_normal: 2.6975
    rolling_mean: 3.0234
    persistence: 3.1217
    seasonal_naive: 3.6050