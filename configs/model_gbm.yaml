# configs/model_gbm.yaml
# Tier 2 GBM — final locked configuration, validated via walk-forward evaluation.

window_length_days: 15

library: "lightgbm"
architecture: "10 independent LGBMRegressor models, one per horizon day
  (direct multi-step, non-shared representation)"

hyperparameters:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8

validation:
  fixed_split_search:
    method: "Manual grid, 6 configurations, full 75-district pool, single split (1984-2010 train / 2011-2018 val)"
    winner: { n_estimators: 200, max_depth: 5, learning_rate: 0.05, num_leaves: 31, rmse_7_10: 2.3388 }
    note: "Superseded as the primary evidence by the walk-forward search below; retained here for history."

  walk_forward_search:
    method: "5 configurations, full 75-district pool, evaluated across all 3 walk-forward folds, selection metric = average RMSE(7-10) across folds"
    grid_tested:
      - { n_estimators: 300, max_depth: 5, learning_rate: 0.03, num_leaves: 31, avg_rmse_7_10: 2.3948 }
      - { n_estimators: 200, max_depth: 5, learning_rate: 0.05, num_leaves: 31, avg_rmse_7_10: 2.3976 }  # chosen
      - { n_estimators: 200, max_depth: 6, learning_rate: 0.05, num_leaves: 63, avg_rmse_7_10: 2.4047 }
      - { n_estimators: 150, max_depth: 3, learning_rate: 0.05, num_leaves: 15, avg_rmse_7_10: 2.4100 }
      - { n_estimators: 100, max_depth: 4, learning_rate: 0.05, num_leaves: 15, avg_rmse_7_10: 2.4101 }
    note: >
      Best (n_estimators=300) beats the retained config by only 0.0028 --
      within noise. Retained the original fixed-split winner rather than
      switching, since it's cheaper (fewer estimators) and already
      save/load verified. GBM's fixed-split and walk-forward winners are
      nearly identical, confirming GBM's tuning was not overfit to the
      single split the way LSTM's was (see model_lstm.yaml).
    full_results_csv: "scripts/kaggle_output/gbm_walkforward_tuning.csv"

  seed_variance_check:
    seeds_tested: [42, 43, 44]
    scale: "Full 75-district pool, all 3 walk-forward folds, locked config (n_estimators=200, max_depth=5, lr=0.05, num_leaves=31)"
    result:
      seed_42: 2.3976
      seed_43: 2.3968
      seed_44: 2.3977
      mean: 2.3974
      std: 0.0004
      range: 0.0008
    note: >
      GBM's reported performance is extremely stable across random
      seeds -- range (0.0008) is only ~0.3% of the ~0.24 RMSE gap to
      LSTM (walk-forward). Unlike LSTM's window-length decision, which
      required exactly this kind of check to catch a near-tie (see
      model_lstm.yaml), GBM's seed variance is unambiguously negligible.
      The "GBM beats LSTM" conclusion carries no meaningful risk from
      GBM's own training randomness.
    full_results_csv: "scripts/gbm_output/seed_variance_results.csv"

performance:
  walk_forward_avg_rmse_7_10: 2.3976
  fold_breakdown: { fold_1: 2.4030, fold_2: 2.3419, fold_3: 2.4480 }

comparison_to_other_tiers:
  lstm_tier3_walk_forward_tuned: { avg_rmse_7_10: 2.6385 }
  note: >
    GBM beats the walk-forward-tuned LSTM by a substantial, consistent
    margin (~0.24 RMSE) across all 3 folds -- confirmed both by
    Diebold-Mariano significance testing (10/10 horizon days
    significant, every fold) and by a seed-variance check confirming
    GBM's own result is highly stable. GBM is the current best
    individual model tier for this project. Full comparison and
    methodology in docs/model_comparison_report.md.