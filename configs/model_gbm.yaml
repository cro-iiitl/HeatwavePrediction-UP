# configs/model_gbm.yaml
# Tier 2 GBM — final locked configuration.
# window_length_days must match all other tiers (master §8.6).
# Uses TREE_FEATURE_COLUMNS (flattened window, includes T2M_MAX's own
# lags/rolling stats) -- distinct from Tier 3's SEQUENCE_FEATURE_COLUMNS,
# since GBM has no internal memory and needs those features explicitly.

window_length_days: 15

library: "lightgbm"
architecture: "10 independent LGBMRegressor models, one per horizon day
  (direct multi-step, non-shared representation)"

hyperparameters:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8

validation:
  fixed_split:
    train: ["1984-01-01", "2010-12-31"]
    validation: ["2011-01-01", "2018-12-31"]

  hyperparameter_search:
    method: "Manual grid, 6 configurations, full 75-district pool, CPU"
    grid_tested:
      - { n_estimators: 100, max_depth: 5,  learning_rate: 0.05, num_leaves: 31,  rmse_7_10: 2.3435 }
      - { n_estimators: 200, max_depth: 5,  learning_rate: 0.05, num_leaves: 31,  rmse_7_10: 2.3388 }  # winner
      - { n_estimators: 200, max_depth: 7,  learning_rate: 0.05, num_leaves: 63,  rmse_7_10: 2.3517 }
      - { n_estimators: 200, max_depth: -1, learning_rate: 0.03, num_leaves: 31,  rmse_7_10: 2.3417 }
      - { n_estimators: 300, max_depth: 7,  learning_rate: 0.03, num_leaves: 63,  rmse_7_10: 2.3488 }
      - { n_estimators: 300, max_depth: -1, learning_rate: 0.05, num_leaves: 127, rmse_7_10: 2.3702 }
    note: >
      All 6 configs land within a tight band (2.339-2.370) -- search was
      not exhaustive (narrow depth/leaf range), but the flatness of
      results across configs suggests a wider search would likely narrow
      the margin to Tier 3, not change the tier ranking. Not pursued
      further given the gap to Tier 3 (see performance section) is
      already well outside this band's spread.

  full_results_csv: "scripts/gbm_output/tuning_results.csv"

performance:
  rmse_avg_7_10: 2.3388
  rmse_avg_1_10: 2.1456

comparison_to_other_tiers:
  lstm_tier3_final_tuned:        { rmse_7_10: 2.2954 }
  lstm_tier3_placeholder_hparams: { rmse_7_10: 2.3646 }
  climatological_normal:          { rmse_7_10: 2.6975 }
  note: >
    Tier 2 GBM (2.3388) is clearly worse than the final tuned Tier 3 LSTM
    (2.2954) by a margin (0.043) well outside this project's observed
    noise floor (typically 0.005-0.015 at full 75-district scale, per
    Tier 3's seed-variance check). Notably, Tier 2 also does not beat
    even the pre-tuning placeholder LSTM (2.3646) -- an untuned LSTM was
    already competitive with GBM's fully searched result. Suggests the
    LSTM's sequential representation captures genuine additional signal
    beyond what a flattened, lag-feature-based GBM can access from the
    same window.